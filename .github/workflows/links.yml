name: External link report

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check external links
        run: |
          npm run check:live 2>&1 | tee report.txt
          {
            echo '### External link report'
            echo 'Some hosts block bots (403/999), so a warning is a prompt to check by hand.'
            echo '```'
            grep '^WARN' report.txt || echo 'No warnings.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
